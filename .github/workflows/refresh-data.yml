# Refreshes the CrimeStats figures from the agencies every Monday and
# publishes data/crimestats-data.json. Runs on GitHub's computers; no API key
# is needed. Start it by hand from the Actions tab with "Run workflow".
name: Refresh data

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

# Read-only by default; only the job below may write, to commit the data file.
permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # to commit the refreshed data file
    steps:
      # Actions are pinned to exact commits, not tags: a tag can be moved to
      # other code, and every step in this job runs before the signing key is
      # used. Dependabot (.github/dependabot.yml) proposes updates to the pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the push token is only given to the Commit step
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Every figure is checked before anything is written. A source that
      # fails keeps its previous values; if the checks refuse the result,
      # nothing is published this week and the status file says why.
      - name: Refresh from the agencies
        working-directory: job
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: node scripts/refresh-data.mjs || echo "::warning::The refreshed data failed its checks; the published file is unchanged."

      - name: Publish, sign and record the run
        env:
          CRIMESTATS_SIGNING_KEY: ${{ secrets.CRIMESTATS_SIGNING_KEY }}
        run: node job/scripts/publish-data.mjs

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data job/src/live-baked.js
          git commit -m "data: weekly refresh $(date -u +%F)" || echo "Nothing changed."
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_REF_NAME}"
